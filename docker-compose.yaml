services:
  postgres:
    image: postgres:17
    container_name: service-center
    restart: unless-stopped
    environment:
      POSTGRES_DB: service-center
      POSTGRES_USER: service-center
      POSTGRES_PASSWORD: service-center
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U service-center -d service-center" ]
      interval: 5s
      retries: 5

volumes:
  postgres_data: