components:
  schemas:
    UserDto:
      type: object
      description: Пользователь системы
      required:
        - id
        - username
        - role
      properties:
        id:
          type: string
          format: uuid
          description: Уникальный идентификатор пользователя
        username:
          type: string
          minLength: 3
          maxLength: 50
          example: operator
        role:
          $ref: './enums.yaml#/components/schemas/Role'

    UserCreateDto:
      type: object
      description: Данные для создания пользователя
      required:
        - username
        - password
        - role
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
        role:
          $ref: './enums.yaml#/components/schemas/Role'

    UserUpdateDto:
      type: object
      description: Данные для изменения пользователя
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
        role:
          $ref: './enums.yaml#/components/schemas/Role'

    ErrorDto:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: Некорректные данные запроса
    OrderDto:
      type: object
      description: Заказ на ремонт изделия
      required:
        - id
        - productName
        - brand
        - ownerFio
        - ownerPhone
        - repairCost
        - acceptanceDate
        - plannedIssueDate
        - status
      properties:
        id:
          type: string
          format: uuid
        productName:
          type: string
          description: Наименование ремонтируемого изделия
          example: Телевизор
        brand:
          type: string
          description: Марка изделия
          example: Samsung
        ownerFio:
          type: string
          description: Фамилия, имя и отчество владельца
          example: Иванов Иван Иванович
          minLength: 2
          maxLength: 255
        ownerPhone:
          type: string
          description: Телефон владельца
          example: '+375295979400'
        repairCost:
          type: number
        acceptanceDate:
          type: string
          format: date
        plannedIssueDate:
          type: string
          format: date
        issueDate:
          type: string
          format: date
          nullable: true
        status:
          $ref: './enums.yaml#/components/schemas/OrderStatus'

    OrderCreateDto:
      type: object
      required:
        - productName
        - brand
        - ownerFio
        - ownerPhone
        - repairCost
        - plannedIssueDate
      properties:
        productName:
          type: string
          minLength: 2
          maxLength: 100
        brand:
          type: string
          minLength: 1
          maxLength: 100
        ownerFio:
          type: string
          minLength: 2
          maxLength: 255
        ownerPhone:
          type: string
          minLength: 5
          maxLength: 30
        repairCost:
          type: number
          minimum: 0
        plannedIssueDate:
          type: string
          format: date

    OrderUpdateDto:
      type: object
      properties:
        productName:
          type: string
          minLength: 2
          maxLength: 100
        brand:
          type: string
          minLength: 1
          maxLength: 100
        ownerFio:
          type: string
          minLength: 2
          maxLength: 255
        ownerPhone:
          type: string
          minLength: 5
          maxLength: 30
        repairCost:
          type: number
          minimum: 0
        plannedIssueDate:
          type: string
          format: date

    IncomeDto:
      type: object
      required:
        - from
        - to
        - total
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        total:
          type: number
          minimum: 0
